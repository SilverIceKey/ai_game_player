[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-game-player"
version = "0.1.0"
description = "面向类魂与第三人称动作游戏的视觉端到端控制系统：从 Video History + Action History 学习 Future Action Chunk 并闭环自主游玩"
requires-python = ">=3.11"
dependencies = [
    "mss",
    "numpy",
    "opencv-python-headless; sys_platform != 'win32'",
    "opencv-python; sys_platform == 'win32'",
    "pydirectinput",
    "pynput",
    "pyyaml",
    "soundcard; sys_platform == 'win32'",
    "windows-capture>=1.5,<2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest"]
train = ["torch", "torchvision"]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["capture*", "dataset*", "model*", "train*", "runtime*", "evaluation*", "observability*", "app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
