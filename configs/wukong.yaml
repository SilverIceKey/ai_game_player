# 黑神话：悟空 专属配置（SPEC v1.0 新 schema：窗口 / 键位映射 §9 / 安全 §39 / 执行器）。
# 键位沿用旧配置语义：WASD 移动、mouse_left=轻棍、space=闪避、r=喝酒、mouse_middle=锁定。
# 标注「实机校准」的键位/参数为合理默认占位，首次实机必须核对游戏内实际键位。

window:
  title: "b1  "        # 截屏窗口定位用（枚举可见窗口，先精确后包含匹配；
                       # 用 python -m app.observe_train --list-windows 查看实际标题）
  capture_backend: auto        # 截屏后端：auto（WGC 窗口内容截屏优先，失败降级 mss）/ mss / wgc
                               # WGC 支持后台/遮挡；mss 截屏幕区域，要求窗口在前台
  foreground_on_start: true    # AUTOPILOT 正式跑（非 --dry-run）启动时把游戏窗口提前台
  # rect: [0, 0, 2560, 1440]   # 可选：手动指定截屏区域 [x, y, w, h]，跳过窗口定位（仅 mss）

keys:                          # 动作 → 实际键位（spec §9：内部动作与键位解耦；mouse_* 前缀为鼠标键）
  move_forward: "w"
  move_back: "s"
  move_left: "a"
  move_right: "d"
  attack_light: "mouse_left"   # 轻棍
  attack_heavy: "mouse_right"  # 重棍（实机校准）
  dodge: "space"               # 闪避
  block: "q"                   # 占位（黑神话无常驻格挡，实机校准）
  parry: "v"                   # 占位（实机校准）
  jump: "ctrl"                 # 跳跃（实机校准）
  interact: "e"                # 互动（实机校准）
  heal: "r"                    # 喝酒
  skill_1: "1"                 # 法术 1（实机校准）
  skill_2: "2"                 # 法术 2（实机校准）
  skill_3: "3"                 # 法术 3（实机校准）
  skill_4: "4"                 # 法术 4（实机校准）
  lock_target: "mouse_middle"  # 锁定目标
  # wait 不映射实际键位：该动作语义就是"无操作"，模型输出空动作即可

safety:                        # Safety Filter / Human Override（spec §39/§40/§26/§47）
  override_key: "F12"          # 人工接管键（toggle）：按下立即停手释放输入，再按交还 AI
  episode_key: "F9"            # OBSERVE_TRAIN 手动 START/STOP EPISODE（spec §21）
  stop_on_focus_lost: true     # 游戏窗口失焦立即 STOP ACTION 并释放输入（spec §39）
  max_button_hold_ms: 5000     # 单按钮最大连续按住时间，超时自动释放（spec §39）
  max_camera_delta: 0.5        # 单步最大视角量（归一化，spec §39）
  max_action_rate_hz: 40       # 最大动作频率（spec §39）
  inference_timeout_ms: 100    # 推理超时 → Pause AI + Release Input（spec §47）
  auto_takeover: true           # 检测到真实键鼠/手柄输入立即接管（spec §26 数据闭环）
  resume_idle_ms: 2500          # 无人工输入持续该时长后自动恢复 AI 控制（spec §26）

executor:                      # NormalizedAction → 键鼠（runtime/input_executor.py）
  pixels_per_unit: 400.0       # 归一化 camera 1.0 对应鼠标像素（实机校准）
  action_pause: 0.01           # 每次输入后的间隔（秒），避免输入洪峰
  move_deadzone: 0.15          # move 轴死区
