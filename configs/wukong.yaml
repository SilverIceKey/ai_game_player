# 黑神话悟空 专属配置（M1：自动清小怪 + 自主寻路）
# 坐标基于 1920x1080；HUD 区域坐标与键位为占位默认值，首次实机必须校准
# （计划文档第 5 节假设 2/3；日志与 runs/<ts>/frames/ 关键帧可辅助校准）。

window:
  title: "b1  "        # 截屏窗口定位用（枚举可见窗口，先精确后包含匹配；用 --list-windows 查看实际标题）
  capture_backend: auto        # 截屏后端：auto（WGC 后台截屏优先，失败降级 mss）/ mss / wgc
                               # WGC 截窗口内容，游戏被 VSCode 遮挡也能抓到；mss 截屏幕区域，要求窗口在前台
  foreground_on_start: true    # 正式跑（非 dry-run/calibrate）启动时把游戏窗口提前台（mss 后端必需）
  # rect: [0, 0, 1920, 1080]   # 可选：手动指定截屏区域 [x, y, w, h]，跳过窗口定位（仅 mss 后端）

perception:
  base_resolution: [1920, 1080]
  odometry:                    # 光流里程计（LK，CPU）
    downscale: 0.5             # 降采样比例，控制 CPU 开销
    max_corners: 200
    quality_level: 0.01
    min_distance: 8
    yaw_per_pixel: 0.002       # 弧度 / 降采样像素（实机校准）
    forward_per_pixel: 0.02    # 局部坐标单位 / 降采样像素（实机校准）
    min_flow: 0.3              # 死区：中位流低于该值视为噪声
    min_tracked: 20            # 有效跟踪点下限
    fb_error: 1.0              # 前向-后向验证容差（降采样像素），过滤弱纹理虚假跟踪
  walkable:                    # 可通行区域评估（画面下半地面分割）
    roi_top_ratio: 0.55        # 只分析该比例以下的画面
    ground_hsv_lower: [0, 0, 40]
    ground_hsv_upper: [179, 90, 220]
    edge_threshold: 80         # Canny 低阈值（高阈值取 2 倍）
    straight_min_score: 0.35   # 中央扇区达到该分即可直行

hud:
  hp_bar:                      # 自身血条（红）
    rect: [140, 1005, 400, 8]
    hsv_lower: [0, 120, 80]
    hsv_upper: [10, 255, 255]
    column_fill: 0.3
  stamina_bar:                 # 体力条（黄绿）
    rect: [140, 1022, 360, 6]
    hsv_lower: [35, 80, 80]
    hsv_upper: [90, 255, 255]
    column_fill: 0.3
  enemy_hp_bar:                # Boss 固定血条（位置固定，Boss 战出现；与普通小怪动态血条互补，优先采用）
    rect: [660, 950, 600, 6]
    hsv_lower: [0, 120, 80]
    hsv_upper: [10, 255, 255]
    column_fill: 0.25
  enemy_search:                # 普通小怪动态血条检测（血条浮在怪头顶、位置不固定；
                               # 在搜索区域内做颜色阈值+轮廓检测，取离画面中心最近的一条）
    rect: [560, 200, 800, 500] # 搜索区域：画面中央偏上（占位值，--edit-roi 实机校准）
    hsv_lower: [0, 120, 80]    # 填充色（血量部分，红）
    hsv_upper: [10, 255, 255]
    track_hsv_lower: [0, 0, 20]    # 背景槽（血条全长，暗色；轮廓检测定全长，填充色算比例）
    track_hsv_upper: [179, 80, 90]
    min_length: 40             # 条最小长度（像素，基准分辨率）
    min_aspect: 3.0            # 长宽比下限（细长水平条）
    min_fill: 0.5              # 轮廓包围盒内匹配像素占比下限（填充均匀度）
    column_fill: 0.3           # 条填充比例按列统计阈值
  gourd:                       # 葫芦（喝酒次数）图标
    rect: [60, 985, 48, 48]
    hsv_lower: [20, 100, 100]
    hsv_upper: [40, 255, 255]
    presence_ratio: 0.05
  dead_indicator:              # 死亡画面提示（如"你已败北"亮色文字区域）
    rect: [760, 400, 400, 120]
    hsv_lower: [0, 0, 180]
    hsv_upper: [179, 60, 255]
    presence_ratio: 0.2

combat:
  heal_hp_threshold: 0.35      # 血量低于该值且有葫芦 → 喝药
  engage_approach_ticks: 10    # 接战后接近 tick 数（近身判定占位，实机校准）
  dodge_interval_ticks: 12     # 战斗固定节奏闪避间隔
  dodge_on_hit_drop: 0.15      # 单 tick 血量跌幅达到该值判定为受击 → 闪避
  enemy_lost_ticks: 8          # 敌方血条连续消失 tick 数 → 脱战
  loot_wait_ticks: 20          # 掉落/脱战等待 tick 数
  enemy_present_min: 0.02      # 敌方血条填充超过该值视为接敌

keys:                          # 键位映射（用户自定义键位实机校准时填入）
  move_forward: "w"
  move_back: "s"
  light_attack: "mouse_left"   # mouse_* 前缀表示鼠标按键
  dodge: "space"
  heal: "r"
  lock_on: "mouse_middle"

control:
  pixels_per_degree: 12.0      # 鼠标像素 / 转角（实机校准）
  move_hold_seconds: 0.35      # 移动键按住时长
  action_pause: 0.05           # 每次输入后的间隔
  turn_degrees_per_second: 180.0  # 转向角速度（度/秒）：转向按该速度拆小步平滑执行，越大越快
  turn_step_interval: 0.02     # 平滑转向的步进间隔（秒）

exploration:                   # 覆盖式探索参数
  grid_size_m: 60.0            # 局部栅格边长（局部坐标单位）
  grid_resolution: 0.5         # 栅格分辨率
  lock_on_interval_ticks: 30   # 每 N tick 尝试一次锁定
  stuck_window: 20             # 卡住判定窗口（tick 数）
  stuck_distance: 0.5          # 窗口内位移小于该值视为卡住
  unstick_turn_ticks: 6        # 脱困转向持续 tick 数
  lookahead: 1.5               # 方向评分前瞻距离
  turn_degrees: 30.0           # 单次转向角
  align_degrees: 15.0          # 导航对齐容差
  switch_margin: 0.15          # 转向迟滞：侧向评分需优于正前方该幅度才转向（抗噪声摇摆）
  turn_commit_ticks: 3         # 航向承诺：选定转向方向后持续 N tick 不再改判
  arrive_distance: 1.0         # 到达探索断点的判定距离
  obstacle_score: 0.2          # 中央扇区评分低于该值时把正前方标记为障碍

dry_run:                       # --dry-run 干跑模式（不发任何键鼠输入）
  frame_interval_ticks: 50     # 周期性抽样落帧间隔（tick）；状态转移/首次接敌照旧落帧
